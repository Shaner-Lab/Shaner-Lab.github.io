<script>
  // Resize Spectrum Tool iframe from EmbedResizeNotifier postMessage events.
  document.addEventListener('DOMContentLoaded', function () {
    var iframe = document.getElementById('spectrum-tool-iframe');
    if (!iframe) return;

    var RESIZE_MESSAGE_TYPE = 'fret-embed-resize';

    function applyHeight(height) {
      if (typeof height !== 'number' || isNaN(height) || height <= 0) return;
      iframe.style.height = height + 'px';
    }

    function fallbackMeasure() {
      try {
        var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
        if (!doc) return;
        var body = doc.body;
        var html = doc.documentElement;
        if (!body || !html) return;
        applyHeight(Math.max(
          body.scrollHeight || 0,
          body.offsetHeight || 0,
          html.clientHeight || 0,
          html.scrollHeight || 0,
          html.offsetHeight || 0
        ));
      } catch (e) {
        // Same-origin only; fail silently if that ever changes.
      }
    }

    window.addEventListener('message', function (event) {
      if (!event.data || event.data.type !== RESIZE_MESSAGE_TYPE) return;
      if (iframe.contentWindow && event.source && event.source !== iframe.contentWindow) return;
      applyHeight(event.data.height);
    });

    iframe.addEventListener('load', function () {
      fallbackMeasure();
      setTimeout(fallbackMeasure, 500);
    });
  });
</script>
